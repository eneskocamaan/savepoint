[workspace]
resolver = "3"
members = [
    "crates/savepoint-core",
    "crates/savepoint-ipc",
    "crates/savepointd",
    "ui/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/eneskocamaan/savepoint"
authors = ["eneskocamaan"]
rust-version = "1.90"
publish = false

[workspace.dependencies]
savepoint-core = { path = "crates/savepoint-core" }
savepoint-ipc = { path = "crates/savepoint-ipc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = "0.62"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
