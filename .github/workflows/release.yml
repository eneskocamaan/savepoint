name: Release

# Pushing a tag such as v0.2.0 builds the portable zip and the installer and
# publishes them as a GitHub release, with the matching CHANGELOG.md section as notes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check that the tag matches the version in Cargo.toml
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match Cargo.toml version $version" }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build and package
        shell: pwsh
        run: ./scripts/package.ps1

      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $text = Get-Content CHANGELOG.md -Raw
          $match = [regex]::Match($text, "(?ms)^## \[$([regex]::Escape($env:VERSION))\][^\n]*\n(.*?)(?=^## \[|^\[)")
          if (-not $match.Success) { throw "No CHANGELOG.md section for $env:VERSION" }
          $notes = $match.Groups[1].Value.Trim()
          $notes += "`n`n---`n**Downloads:** the ``setup.exe`` installs Savepoint for your user (recommended); the ``portable.zip`` runs without installing. Windows 10 or 11, 64-bit. Check a download with ``Get-FileHash <file>`` against ``SHA256SUMS.txt``."
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8

      - uses: softprops/action-gh-release@v3
        with:
          name: Savepoint ${{ env.VERSION }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist/*-setup.exe
            dist/*-portable.zip
            dist/SHA256SUMS.txt
